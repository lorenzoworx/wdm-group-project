deployment:
  tasks:
    # Paths
    - export REPO=/home/bxp7143/repositories/wdm-group-project
    - export WEB=/home/bxp7143/public_html

    # Sanity: fail fast if React build is missing
    - /usr/bin/test -f "$REPO/client/build/index.html" || (echo "ERROR: client/build missing. Run npm run build & commit it." && exit 1)

    # Ensure target dirs exist
    - /bin/mkdir -p "$WEB" "$WEB/api" "$WEB/resources"

    # 1) Frontend -> web root
    # Protect /api and /resources from deletions while still cleaning old SPA files
    - /usr/bin/rsync -a --delete --filter='protect api/' --filter='protect resources/' "$REPO/client/build/" "$WEB/"

    # 2) PHP API -> /api  (delete removed endpoints)
    - /usr/bin/rsync -a --delete "$REPO/server/api/" "$WEB/api/"

    # 3) Optional resources -> /resources (ignore if folder not present)
    - /usr/bin/rsync -a --delete "$REPO/server/resources/" "$WEB/resources/" || true

    # 4) Ensure SPA .htaccess exists (only write if missing)
    - /usr/bin/test -f "$WEB/.htaccess" || printf "%s\n" "<IfModule mod_rewrite.c>" "RewriteEngine On" "RewriteBase /" "RewriteRule ^api/ - [L]" "RewriteCond %{REQUEST_FILENAME} -f [OR]" "RewriteCond %{REQUEST_FILENAME} -d" "RewriteRule ^ - [L]" "RewriteRule . /index.html [L]" "</IfModule>" > "$WEB/.htaccess"

    # Marker you can load in the browser to confirm the deploy finished
    - /bin/date -u > "$WEB/DEPLOY.txt"
