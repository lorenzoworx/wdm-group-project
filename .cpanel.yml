---
deployment:
  tasks:
    - 'export REPO=/home/bxp7143/repositories/wdm-group-project'
    - 'export WEB=/home/bxp7143/public_html'

    # ensure target dirs exist
    - '/bin/mkdir -p $WEB $WEB/api'

    # copy built React app (assumes client/build is already committed)
    - '/bin/rsync -a --delete $REPO/client/build/ $WEB/'

    # copy PHP API
    - '/bin/rsync -a $REPO/server/api/ $WEB/api/'

    # write a minimal .htaccess for SPA routing (NO <IfModule> block)
    - '/bin/bash -lc "cat > $WEB/.htaccess <<EOF
RewriteEngine On
RewriteBase /
# allow /api/* to hit PHP
RewriteRule ^api/ - [L]
# pass through files/dirs
RewriteCond %{REQUEST_FILENAME} -f [OR]
RewriteCond %{REQUEST_FILENAME} -d
RewriteRule ^ - [L]
# everything else -> React
RewriteRule . /index.html [L]
EOF"'
