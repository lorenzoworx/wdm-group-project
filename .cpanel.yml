---
deployment:
  tasks:
    - /bin/bash -lc '
      set -e
      DEPLOYPATH="/home/bxp7143/public_html"
      # publish React build but keep API/resources
      /usr/bin/rsync -a --delete \
      --exclude "api/**" \
      --exclude "resources/**" \
      --exclude ".well-known/**" \
      client/build/ "$DEPLOYPATH/"
      echo "Deploy OK at $(date)"
      '
