deployment:
  tasks:
    - export REPO=/home/bxp7143/repositories/wdm-group-project
    - export WEB=/home/bxp7143/public_html

    # 1) Push React build, but DO NOT overwrite the root .htaccess
    - /usr/bin/rsync -a --delete \
      --exclude ".htaccess" \
      --exclude "api/**" --exclude "resources/**" \
      "$REPO/client/build/" "$WEB/"

    # 2) Push PHP API
    - /usr/bin/rsync -a "$REPO/server/api/" "$WEB/api/"

    # 3) Put the root .htaccess in place
    - /usr/bin/install -m 0644 "$REPO/server/.htaccess" "$WEB/.htaccess"

    # 4) Ensure the API .htaccess is in place
    - /usr/bin/install -m 0644 "$REPO/server/api/.htaccess" "$WEB/api/.htaccess"

    # marker
    - /bin/echo "Deploy OK $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
